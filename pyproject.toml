[project]
name = "vibing-sc2"
version = "0.1.0"
description = "A Vibe coded StarCraft II Bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["burnysc2>=7.1.3"]

[dependency-groups]
dev = ["pytest>=9.0.2"]
lint = ["pre-commit>=4.5.1", "ruff>=0.15.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff.lint]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
